version: '3.9'

services:

  postgres:
    image: postgres:16-alpine
    container_name: chatbot_postgres
    environment:
      POSTGRES_DB: chatbot_db
      POSTGRES_USER: chatbot_user
      POSTGRES_PASSWORD: secret123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  chromadb:
    # Version épinglée (serveur ChromaDB 1.4.1) : ":latest" a déjà changé
    # le dossier de stockage (/chroma/chroma -> /data) sans prévenir, d'où
    # des données hors du volume (anomalie n°6). Épinglé par digest = l'image
    # exacte qui a servi à indexer la base ; le tag 1.4.1 publié aujourd'hui
    # sur Docker Hub est une autre build. Le client Python (chromadb 1.5.9
    # dans requirements.txt) est compatible avec ce serveur.
    image: chromadb/chroma:1.4.1@sha256:a99b0c00d31610aac77e5e4536d7182d6981c51b1e93acf8d3b6fa7e5eb02d9a
    container_name: chatbot_chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: chatbot_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: chatbot_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: unless-stopped

  # API FastAPI (Dockerfile). Derrière un profil : "docker compose up" ne la
  # lance pas (comportement inchangé) ; pour la lancer :
  #   docker compose --profile api up -d --build api
  # Les variables viennent de .env (env_file) ; seules les adresses des
  # services sont surchargées ici, avec leur nom de service Compose.
  api:
    profiles: ["api"]
    build: .
    image: lissstrike-api
    container_name: chatbot_api
    env_file: .env
    environment:
      # Identifiants lus dans .env (interpolation Compose), aucune valeur ici
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"   # port interne du conteneur ChromaDB (8001 côté hôte)
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - chromadb
    restart: unless-stopped

volumes:
  postgres_data:
  chroma_data:
  redis_data: