<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liss Strike — Assistant</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-a: #eef1fb;
    --bg-b: #f8f9fd;
    --panel: #ffffff;
    --border: #e6e8f2;
    --text: #191c28;
    --text-muted: #6b7280;

    /* Marque Liss Strike : indigo profond + accent vert "électronique" */
    --primary: #4338ca;
    --primary-light: #6366f1;
    --primary-dark: #312a91;
    --primary-text: #ffffff;
    --accent-green: #10b981;

    --assistant-bubble: #f2f3f9;
    --escalate-border: #f59e0b;
    --escalate-bg: #fff7ed;
    --escalate-bg-2: #fef3c7;
    --escalate-text: #92400e;

    --radius: 16px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 55%, var(--bg-a) 100%);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 760px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    box-shadow: 0 0 60px rgba(67, 56, 202, 0.08);
  }

  /* ── Header ─────────────────────────────────────────── */
  header {
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    background: linear-gradient(120deg, var(--primary-dark) 0%, var(--primary) 55%, var(--primary-light) 100%);
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  header::after {
    /* légère texture lumineuse en fond de header, purement décorative */
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 85% -20%, rgba(16, 185, 129, 0.35), transparent 55%);
    pointer-events: none;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
    z-index: 1;
  }

  .brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.5px;
  }

  header h1 {
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.2px;
  }

  header .subtitle {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.75);
    margin-top: 1px;
    font-weight: 400;
  }

  /* ── Badge de statut connexion ──────────────────────── */
  #status-label {
    position: relative;
    z-index: 1;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255, 255, 255, 0.22);
    color: #fff;
  }

  #status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #d1d5db;
    display: inline-block;
    position: relative;
  }
  #status-dot.connected {
    background: var(--accent-green);
    box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6);
    animation: pulse-dot 1.8s ease-out infinite;
  }
  #status-dot.disconnected { background: #f87171; }

  @keyframes pulse-dot {
    0%   { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.55); }
    70%  { box-shadow: 0 0 0 7px rgba(16, 185, 129, 0); }
    100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
  }

  /* ── Messages ───────────────────────────────────────── */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .row {
    display: flex;
    flex-direction: column;
    max-width: 78%;
    animation: rise-in 0.32s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes rise-in {
    from { opacity: 0; transform: translateY(8px) scale(0.985); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .row.user { align-self: flex-end; align-items: flex-end; }
  .row.assistant { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 11px 15px;
    border-radius: var(--radius);
    line-height: 1.5;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
  }
  .row.user .bubble {
    background: linear-gradient(135deg, var(--primary-light), var(--primary));
    color: var(--primary-text);
    border-bottom-right-radius: 4px;
  }
  .row.assistant .bubble {
    background: var(--assistant-bubble);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .row.assistant .bubble.escalated {
    background: var(--escalate-bg);
    border: 1.5px solid var(--escalate-border);
    box-shadow: 0 2px 10px rgba(245, 158, 11, 0.12);
  }

  /* ── Indicateur de frappe ("typing…") ───────────────── */
  .bubble.typing-bubble {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 14px 16px;
  }
  .typing-bubble .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    opacity: 0.5;
    animation: typing-bounce 1.1s ease-in-out infinite;
  }
  .typing-bubble .dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-bubble .dot:nth-child(3) { animation-delay: 0.30s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 0.9; }
  }

  /* ── Métadonnées sous chaque réponse ────────────────── */
  .meta {
    margin-top: 6px;
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .badge-escalate {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--escalate-text);
    background: linear-gradient(135deg, var(--escalate-bg-2), #fde9c8);
    border: 1px solid var(--escalate-border);
    border-radius: 999px;
    padding: 4px 12px 4px 8px;
    box-shadow: 0 1px 3px rgba(245, 158, 11, 0.18);
  }
  .badge-escalate svg { width: 13px; height: 13px; flex-shrink: 0; }

  .meta-details {
    font-variant-numeric: tabular-nums;
  }

  /* ── Composer ───────────────────────────────────────── */
  #composer {
    display: flex;
    gap: 10px;
    padding: 16px 18px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--panel);
  }

  #msg-input {
    flex: 1;
    padding: 12px 16px;
    border: 1.5px solid var(--border);
    border-radius: 999px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
    background: var(--bg-b);
  }
  #msg-input:focus {
    border-color: var(--primary-light);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    background: #fff;
  }

  #send-btn {
    background: linear-gradient(135deg, var(--primary-light), var(--primary));
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 0 22px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  #send-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  #send-btn:hover:not(:disabled) { filter: brightness(1.08); }
  #send-btn:active:not(:disabled) { transform: scale(0.97); }

  @media (max-width: 720px) {
    .app { box-shadow: none; }
    .row { max-width: 88%; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="brand-mark">LS</div>
      <div>
        <h1>Liss Strike</h1>
        <div class="subtitle">Assistant en ligne — Web</div>
      </div>
    </div>
    <div id="status-label">
      <span id="status-dot"></span><span id="status-text">Connexion…</span>
    </div>
  </header>

  <div id="messages"></div>

  <div id="composer">
    <input id="msg-input" type="text" placeholder="Écrivez votre message…" autocomplete="off" />
    <button id="send-btn">Envoyer</button>
  </div>
</div>

<script>
  const clientId = crypto.randomUUID();
  const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
  const wsUrl = `${wsProtocol}//${location.host}/ws/${clientId}`;

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("msg-input");
  const sendBtn = document.getElementById("send-btn");
  const statusDot = document.getElementById("status-dot");
  const statusText = document.getElementById("status-text");

  let ws;

  function setStatus(state) {
    statusDot.className = state;
    statusText.textContent = state === "connected" ? "Connecté"
      : state === "disconnected" ? "Déconnecté"
      : "Connexion…";
    sendBtn.disabled = state !== "connected";
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addUserMessage(text) {
    const row = document.createElement("div");
    row.className = "row user";
    row.innerHTML = `<div class="bubble"></div>`;
    row.querySelector(".bubble").textContent = text;
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  // ── Indicateur de frappe — purement visuel, ajouté autour de
  // l'envoi/réception existants, ne touche à aucune logique WebSocket.
  let typingRow = null;

  function showTyping() {
    typingRow = document.createElement("div");
    typingRow.className = "row assistant";
    typingRow.innerHTML = `
      <div class="bubble typing-bubble">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>`;
    messagesEl.appendChild(typingRow);
    scrollToBottom();
  }

  function hideTyping() {
    if (typingRow) {
      typingRow.remove();
      typingRow = null;
    }
  }

  const ESCALATE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8l4 4-4 4"/><path d="M3 12h18"/><circle cx="6" cy="12" r="2.4"/></svg>`;

  function addAssistantMessage(data) {
    const row = document.createElement("div");
    row.className = "row assistant";

    const bubble = document.createElement("div");
    bubble.className = "bubble" + (data.escalated ? " escalated" : "");
    bubble.textContent = data.response;
    row.appendChild(bubble);

    const meta = document.createElement("div");
    meta.className = "meta";

    if (data.escalated) {
      const badge = document.createElement("span");
      badge.className = "badge-escalate";
      badge.innerHTML = ESCALATE_ICON + "transféré vers un agent" + (data.escalation_reason ? ` (${data.escalation_reason})` : "");
      meta.appendChild(badge);
    }

    const details = document.createElement("span");
    details.className = "meta-details";
    const parts = [];
    if (data.intent) parts.push(`intent: ${data.intent}`);
    if (typeof data.confidence === "number") parts.push(`confiance: ${data.confidence.toFixed(2)}`);
    if (typeof data.processing_time_ms === "number") parts.push(`${data.processing_time_ms} ms`);
    details.textContent = parts.join(" · ");
    meta.appendChild(details);

    row.appendChild(meta);
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function connect() {
    setStatus("connecting");
    ws = new WebSocket(wsUrl);

    ws.onopen = () => setStatus("connected");
    ws.onclose = () => setStatus("disconnected");
    ws.onerror = () => setStatus("disconnected");

    ws.onmessage = (event) => {
      hideTyping();
      const data = JSON.parse(event.data);
      addAssistantMessage(data);
    };
  }

  function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    addUserMessage(text);
    ws.send(text);
    inputEl.value = "";
    showTyping();
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  connect();
</script>
</body>
</html>
