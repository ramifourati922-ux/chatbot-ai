<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liss Strike — Conseillers</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎧</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Mêmes couleurs que l'interface client (static/chat.html) */
  :root {
    --bg-a: #eef1fb;
    --bg-b: #f8f9fd;
    --panel: #ffffff;
    --border: #e6e8f2;
    --text: #191c28;
    --text-muted: #6b7280;
    --primary: #4338ca;
    --primary-light: #6366f1;
    --primary-dark: #312a91;
    --accent-green: #10b981;
    --escalate-border: #f59e0b;
    --escalate-bg: #fff7ed;
    --escalate-text: #92400e;
    --danger: #dc2626;
    --radius: 16px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 55%, var(--bg-a) 100%);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  header {
    background: linear-gradient(120deg, var(--primary-dark), var(--primary) 55%, var(--primary-light));
    color: #fff;
    padding: 20px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
  .counter {
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 999px;
    padding: 8px 16px;
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
  }
  main { max-width: 1100px; margin: 28px auto; padding: 0 20px; }
  .toolbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px; color: var(--text-muted); font-size: 13px;
  }
  .toolbar button {
    background: var(--panel); border: 1px solid var(--border); color: var(--primary);
    border-radius: var(--radius-sm); padding: 7px 14px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .toolbar-actions { display: flex; gap: 8px; }
  .toolbar button:disabled { color: var(--text-muted); cursor: default; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 8px 30px rgba(49, 42, 145, .08);
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--text-muted); font-weight: 600; padding: 14px 18px; border-bottom: 1px solid var(--border);
  }
  td { padding: 14px 18px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .question { max-width: 380px; word-wrap: break-word; }
  .customer { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; color: var(--text-muted); word-break: break-all; }
  .channel {
    display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600;
    background: #eef2ff; color: var(--primary);
  }
  .reason {
    display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600;
    background: var(--escalate-bg); color: var(--escalate-text); border: 1px solid var(--escalate-border);
    white-space: nowrap;
  }
  .taken {
    display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600;
    background: #ecfdf5; color: #047857; border: 1px solid var(--accent-green); white-space: nowrap;
    margin-top: 6px;
  }
  .waiting { white-space: nowrap; color: var(--text-muted); }
  .waiting.long { color: var(--danger); font-weight: 600; }
  .resolve {
    background: var(--accent-green); color: #fff; border: none; border-radius: var(--radius-sm);
    padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .resolve:disabled { opacity: .5; cursor: default; }
  .empty, .error { padding: 48px 20px; text-align: center; color: var(--text-muted); }
  .empty strong { display: block; font-size: 16px; color: var(--text); margin-bottom: 6px; }
  .error { color: var(--danger); }
  .note { margin-top: 14px; font-size: 12px; color: var(--text-muted); }
  /* hidden doit l'emporter sur les display: flex ci-dessous */
  [hidden] { display: none !important; }
  .actions { display: flex; gap: 8px; }
  .open {
    background: var(--panel); color: var(--primary); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 8px 14px; font: inherit; font-weight: 600;
    cursor: pointer; white-space: nowrap;
  }
  tr.selected td { background: #f5f6ff; }
  #conversation { margin-top: 20px; }
  .conv-head {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
  }
  .conv-head strong { font-size: 15px; }
  .conv-head .customer { margin-left: 8px; }
  .conv-head button { background: none; border: none; font-size: 20px; color: var(--text-muted); cursor: pointer; }
  .history { max-height: 420px; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 14px; font-size: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .msg .who { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
  .msg.user { align-self: flex-start; background: #f1f3f9; }
  .msg.assistant { align-self: flex-start; background: #eef2ff; }
  .msg.agent { align-self: flex-end; background: var(--primary); color: #fff; }
  .msg.agent .who { color: rgba(255,255,255,.8); }
  .reply { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--border); }
  .reply textarea {
    flex: 1; resize: vertical; min-height: 44px; font: inherit; font-size: 14px;
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px;
  }
  .reply button {
    background: var(--primary); color: #fff; border: none; border-radius: var(--radius-sm);
    padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .reply button:disabled { opacity: .5; cursor: default; }
  .feedback { padding: 0 18px 14px; font-size: 13px; }
  .feedback.ok { color: var(--accent-green); }
  .feedback.ko { color: var(--danger); }
</style>
</head>
<body>
<header>
  <div>
    <h1>Liss Strike — Conversations transférées</h1>
    <p>Clients que l'assistant a transférés à un conseiller<span id="whoami"></span></p>
  </div>
  <div class="counter" id="counter">…</div>
</header>

<main>
  <div class="toolbar">
    <span id="last-refresh">Chargement…</span>
    <div class="toolbar-actions">
      <button id="notify" type="button" hidden>Activer les notifications</button>
      <button id="refresh" type="button">Actualiser</button>
    </div>
  </div>
  <div class="card" id="card"></div>
  <section class="card" id="conversation" hidden>
    <div class="conv-head">
      <div><strong id="conv-title">Conversation</strong><span class="customer" id="conv-customer"></span></div>
      <button type="button" id="conv-close" title="Fermer">×</button>
    </div>
    <div class="history" id="history"></div>
    <form class="reply" id="reply-form">
      <textarea id="reply-text" maxlength="4096" placeholder="Votre réponse au client…" required></textarea>
      <button type="submit" id="reply-send">Envoyer</button>
    </form>
    <div class="feedback" id="feedback" hidden></div>
  </section>
  <p class="note">Liste actualisée automatiquement toutes les 10 secondes. Page interne : un compte par conseiller (HTTP Basic) ; pour changer de compte, fermer le navigateur.</p>
</main>

<script>
(() => {
  "use strict";

  const REFRESH_MS = 10000;
  const REASONS = {
    explicit: "Demande d'un conseiller",
    frustration: "Client mécontent",
    low_rag_confidence: "Réponse non trouvée",
    repeated_rag_failure: "Échecs répétés",
    order_tracking: "Suivi de commande",
  };
  const CHANNELS = { web: "Web", whatsapp: "WhatsApp", messenger: "Messenger" };

  const card = document.getElementById("card");
  const counter = document.getElementById("counter");
  const lastRefresh = document.getElementById("last-refresh");

  function waitingLabel(seconds) {
    if (seconds < 60) return "à l'instant";
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `il y a ${minutes} min`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `il y a ${hours} h ${minutes % 60} min`;
    return `il y a ${Math.floor(hours / 24)} j`;
  }

  // Tout le contenu venant des clients passe par textContent (jamais
  // innerHTML) : une question contenant du HTML ne doit pas s'exécuter
  // dans la page du conseiller.
  function cell(text, className) {
    const td = document.createElement("td");
    if (className) td.className = className;
    td.textContent = text;
    return td;
  }

  function badge(text, className) {
    const td = document.createElement("td");
    const span = document.createElement("span");
    span.className = className;
    span.textContent = text;
    td.appendChild(span);
    return td;
  }

  function message(className, title, text) {
    card.replaceChildren();
    const div = document.createElement("div");
    div.className = className;
    if (title) {
      const strong = document.createElement("strong");
      strong.textContent = title;
      div.appendChild(strong);
    }
    div.appendChild(document.createTextNode(text));
    card.appendChild(div);
  }

  function render(escalations) {
    const taken = escalations.filter((e) => e.status === "agent").length;
    counter.textContent = `${escalations.length - taken} en attente` + (taken ? ` · ${taken} prise(s) en main` : "");
    if (escalations.length === 0) {
      message("empty", "Aucune conversation en attente", "Les nouveaux transferts apparaîtront ici automatiquement.");
      return;
    }
    const table = document.createElement("table");
    const thead = document.createElement("thead");
    const headRow = document.createElement("tr");
    for (const label of ["Attente", "Canal", "Raison", "Question / dernier message du client", "Client", ""]) {
      const th = document.createElement("th");
      th.textContent = label;
      headRow.appendChild(th);
    }
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");
    for (const e of escalations) {
      const row = document.createElement("tr");
      const waiting = cell(waitingLabel(e.waiting_seconds), "waiting" + (e.waiting_seconds >= 900 ? " long" : ""));
      waiting.title = new Date(e.escalated_at).toLocaleString("fr-FR");
      row.appendChild(waiting);
      row.appendChild(badge(CHANNELS[e.channel] || e.channel, "channel"));
      const reasonCell = badge(REASONS[e.reason] || e.reason || "—", "reason");
      if (e.status === "agent") {
        // Conseiller aux commandes : le bot ne répond plus à ce client
        const takenBadge = document.createElement("span");
        takenBadge.className = "taken";
        takenBadge.textContent = e.taken_over_by ? `Pris en main par ${e.taken_over_by}` : "Pris en main";
        reasonCell.append(document.createElement("br"), takenBadge);
      }
      row.appendChild(reasonCell);
      row.appendChild(cell(e.last_question || "—", "question"));
      row.appendChild(cell(e.customer_id || "—", "customer"));

      const actionCell = document.createElement("td");
      const actions = document.createElement("div");
      actions.className = "actions";
      const open = document.createElement("button");
      open.className = "open";
      open.type = "button";
      open.textContent = "Voir la conversation";
      open.addEventListener("click", () => openConversation(e.conversation_id));
      const button = document.createElement("button");
      button.className = "resolve";
      button.type = "button";
      button.textContent = "Marquer traitée";
      button.addEventListener("click", () => resolve(e.conversation_id, button));
      actions.append(open, button);
      actionCell.appendChild(actions);
      if (e.conversation_id === openId) row.className = "selected";
      row.appendChild(actionCell);
      tbody.appendChild(row);
    }
    table.appendChild(tbody);
    card.replaceChildren(table);
  }

  async function load() {
    try {
      // Le navigateur renvoie les identifiants saisis à l'invite de
      // connexion (HTTP Basic) ; 401 = ils ne sont plus valides.
      const response = await fetch("/admin/escalations");
      if (response.status === 401) {
        counter.textContent = "—";
        message("error", "", "Identifiants refusés : rechargez la page pour vous reconnecter.");
        return;
      }
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const escalations = await response.json();
      render(escalations);
      notifyNewEscalations(escalations);
      if (openId) await loadHistory();
      lastRefresh.textContent = `Mis à jour à ${new Date().toLocaleTimeString("fr-FR")}`;
    } catch (err) {
      counter.textContent = "—";
      message("error", "", `Impossible de charger les escalades (${err.message}). L'API tourne-t-elle ?`);
    }
  }

  async function resolve(conversationId, button) {
    button.disabled = true;
    button.textContent = "…";
    try {
      const response = await fetch(`/admin/escalations/${conversationId}/resolve`, { method: "POST" });
      // 409 = déjà traitée (par exemple dans un autre onglet) : on rafraîchit simplement
      if (!response.ok && response.status !== 409) throw new Error(`HTTP ${response.status}`);
    } catch (err) {
      button.disabled = false;
      button.textContent = "Réessayer";
      return;
    }
    if (conversationId === openId) closeConversation();
    await load();
  }

  // ── Historique et réponse au client ───────────────────────────────
  const conversation = document.getElementById("conversation");
  const history = document.getElementById("history");
  const replyForm = document.getElementById("reply-form");
  const replyText = document.getElementById("reply-text");
  const replySend = document.getElementById("reply-send");
  const feedback = document.getElementById("feedback");
  const WHO = { user: "Client", assistant: "Assistant", agent: "Conseiller" };
  let openId = null;

  function showFeedback(text, ok) {
    feedback.textContent = text;
    feedback.className = "feedback " + (ok ? "ok" : "ko");
    feedback.hidden = false;
  }

  function renderHistory(conv) {
    document.getElementById("conv-title").textContent = `Conversation ${CHANNELS[conv.channel] || conv.channel}`
      + (conv.status === "agent" ? " · prise en main (le bot ne répond plus)" : "");
    document.getElementById("conv-customer").textContent = conv.customer_id || "";
    // Défilement conservé si le conseiller est remonté dans l'historique
    const atBottom = history.scrollHeight - history.scrollTop - history.clientHeight < 40;
    history.replaceChildren();
    for (const m of conv.messages) {
      const div = document.createElement("div");
      div.className = `msg ${m.role}`;
      const who = document.createElement("span");
      who.className = "who";
      who.textContent = [WHO[m.role] || m.role, m.agent, new Date(m.created_at).toLocaleTimeString("fr-FR")]
        .filter(Boolean).join(" · ");  // "Conseiller · sarra · 14:02:10"
      div.append(who, document.createTextNode(m.content));  // texte brut, jamais de HTML
      history.appendChild(div);
    }
    if (atBottom) history.scrollTop = history.scrollHeight;
  }

  async function loadHistory() {
    const id = openId;
    try {
      const response = await fetch(`/admin/escalations/${id}/messages`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const conv = await response.json();
      if (id === openId) renderHistory(conv);
    } catch (err) {
      if (id === openId) showFeedback(`Impossible de charger l'historique (${err.message}).`, false);
    }
  }

  async function openConversation(id) {
    openId = id;
    feedback.hidden = true;
    replyText.value = "";
    history.replaceChildren();
    conversation.hidden = false;
    await load();  // surligne la ligne ouverte et charge l'historique
    history.scrollTop = history.scrollHeight;
    conversation.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function closeConversation() {
    openId = null;
    conversation.hidden = true;
    for (const row of card.querySelectorAll("tbody tr")) row.classList.remove("selected");
  }

  replyForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const text = replyText.value.trim();
    if (!text || !openId) return;
    replySend.disabled = true;
    feedback.hidden = true;
    try {
      const response = await fetch(`/admin/escalations/${openId}/reply`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      if (!response.ok) {
        // Erreur de l'API (client injoignable, identifiants Meta absents...) :
        // le conseiller doit savoir que rien n'est parti.
        let detail = `HTTP ${response.status}`;
        try { detail = (await response.json()).detail || detail; } catch (e) { /* corps non JSON */ }
        showFeedback(`Message NON envoyé : ${typeof detail === "string" ? detail : JSON.stringify(detail)}`, false);
        return;
      }
      replyText.value = "";
      showFeedback("Message envoyé au client. Vous avez la main : le bot ne lui répond plus "
        + "jusqu'à « Marquer traitée » (ou 1 h sans message de votre part).", true);
      await loadHistory();
      history.scrollTop = history.scrollHeight;
    } catch (err) {
      showFeedback(`Message NON envoyé : ${err.message}`, false);
    } finally {
      replySend.disabled = false;
    }
  });

  document.getElementById("conv-close").addEventListener("click", closeConversation);

  // ── Notifications navigateur ─────────────────────────────────────
  // Signale une NOUVELLE escalade même si l'onglet n'est pas au premier
  // plan. Tout est optionnel : sans l'API Notification ou sans
  // permission, la page fonctionne exactement comme avant.
  const notifyButton = document.getElementById("notify");
  const notificationsSupported = "Notification" in window;
  // Identifiants de conversation du cycle précédent. null = premier
  // chargement : on mémorise seulement, sans notifier les escalades déjà
  // en attente (sinon elles déclencheraient toutes une notification).
  let knownIds = null;

  function updateNotifyButton() {
    if (!notificationsSupported) return;  // bouton laissé caché
    notifyButton.hidden = false;
    const permission = Notification.permission;
    notifyButton.disabled = permission !== "default";
    notifyButton.textContent = permission === "granted" ? "Notifications activées"
      : permission === "denied" ? "Notifications bloquées" : "Activer les notifications";
    notifyButton.title = permission === "denied"
      ? "Autorisez les notifications pour ce site dans les paramètres du navigateur." : "";
  }

  async function requestNotifications() {
    // La permission ne peut être demandée qu'après un geste de
    // l'utilisateur (clic), jamais automatiquement au chargement.
    try {
      await Notification.requestPermission();
    } catch (err) {
      // navigateur ancien ou refus : la page reste fonctionnelle
    }
    updateNotifyButton();
  }

  function notifyNewEscalations(escalations) {
    const ids = new Set(escalations.map((e) => e.conversation_id));
    const previous = knownIds;
    knownIds = ids;
    if (previous === null || !notificationsSupported || Notification.permission !== "granted") return;
    for (const e of escalations) {
      if (previous.has(e.conversation_id)) continue;
      try {
        // Texte brut (pas de HTML dans une notification) ; tag = conversation :
        // le navigateur ne l'affiche qu'une fois même en cas de doublon.
        const notification = new Notification("Nouvelle conversation transférée", {
          body: `${CHANNELS[e.channel] || e.channel} · ${REASONS[e.reason] || e.reason || ""}\n`
            + `« ${e.last_question || "—"} »\nClient : ${e.customer_id || "—"}`,
          tag: e.conversation_id,
        });
        notification.onclick = () => {
          window.focus();
          notification.close();
        };
      } catch (err) {
        // échec d'affichage (système, mode focus...) : sans conséquence pour la page
      }
    }
  }

  if (notificationsSupported) {
    notifyButton.addEventListener("click", requestNotifications);
    updateNotifyButton();
  }

  // Conseiller connecté (chaque conseiller a son propre compte)
  fetch("/admin/me").then((r) => (r.ok ? r.json() : null)).then((me) => {
    if (me) document.getElementById("whoami").textContent = ` · connecté : ${me.username} (${me.role})`;
  }).catch(() => {});

  document.getElementById("refresh").addEventListener("click", load);
  load();
  setInterval(load, REFRESH_MS);
})();
</script>
</body>
</html>
